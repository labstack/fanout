# goreleaser config for Fanout.
# Docs: https://goreleaser.com/customization/
#
# CGO is required (DuckDB), so cross-compilation is impractical. The release
# pipeline (.github/workflows/release.yml) runs `goreleaser build
# --single-target` on three native runners (ubuntu-24.04, ubuntu-24.04-arm,
# macos-14); a final job archives + checksums + publishes via `gh release
# create`. The archive/changelog stanzas below stay for `goreleaser release`
# in local snapshot/dev use.

version: 2

project_name: fanout

before:
  hooks:
    - bun --cwd web install --frozen-lockfile
    - bun --cwd web run build
    - sh -c "rm -rf internal/ui/dist/* && cp -r web/dist/. internal/ui/dist/"

builds:
  - id: fanout
    main: ./cmd/fanout
    binary: fanout
    env:
      - CGO_ENABLED=1
    flags:
      - -trimpath
    ldflags:
      - -s
      - -w
      - -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ignore:
      # Apple Silicon only — Intel Macs are EOL for our target users.
      - goos: darwin
        goarch: amd64

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md

checksum:
  name_template: SHA256SUMS
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^chore:"
      - "^docs:"
      - "^test:"
      - "^style:"
      - "^ci:"
      - "Merge pull request"

release:
  github:
    owner: labstack
    name: fanout
  draft: false
  prerelease: auto
  name_template: "{{ .Tag }}"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot+{{ .ShortCommit }}"
