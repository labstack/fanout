version: "0.5"

processes:
  server:
    command: air
    working_dir: .
    environment:
      - OTEL_SERVICE_NAME=fanout
    env_file: ./.env

  ui:
    # Compiler/watch process only; the Go server still serves the UI.
    command: bun run build:watch
    working_dir: ./ui/host

  site:
    command: bun run dev --host --port 7522
    working_dir: ./site
