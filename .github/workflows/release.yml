name: Release

on:
  push:
    tags:
      - "fanout/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. fanout/v2026.04.1)"
        required: true

concurrency:
  group: release-fanout
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

defaults:
  run:
    shell: bash

env:
  REGISTRY: ghcr.io
  GO_VERSION: "1.26.1"
  BUN_VERSION: "1.3.9"
  TAG_PATTERN: '^fanout/v[0-9]{4}\.[0-9]{2}\.[0-9]+(-[A-Za-z0-9.]+)?$'

jobs:
  # ── Native binaries (Linux amd64, Linux arm64, macOS arm64) ──────────
  # Each runner builds for its own native arch via `goreleaser release
  # --split --single-target`. CGO + DuckDB under QEMU is impractical, so
  # we avoid cross-compilation entirely.
  binaries:
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-14
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # goreleaser needs full git history for changelog

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: goreleaser release --split --single-target
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean --split --single-target
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload partial dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # ── Multi-arch Docker (linux/amd64, linux/arm64) ─────────────────────
  # Each native runner builds + pushes a SHA-suffixed single-arch image;
  # the manifest job stitches them together under the real tags.
  docker:
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    outputs:
      version: ${{ steps.version.outputs.value }}
      stable: ${{ steps.version.outputs.stable }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve and validate version
        id: version
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.tag }}" ]]; then
            raw="${{ inputs.tag }}"
          else
            raw="${GITHUB_REF_NAME}"
          fi
          if [[ ! "$raw" =~ ${{ env.TAG_PATTERN }} ]]; then
            echo "::error::tag must match fanout/vYYYY.MM.N (optionally -suffix), got: $raw"
            exit 1
          fi
          version="${raw#fanout/}"
          # Stable = no prerelease suffix (no '-' in the version part).
          if [[ "$version" == *-* ]]; then
            stable=false
          else
            stable=true
          fi
          echo "value=$version" >>"$GITHUB_OUTPUT"
          echo "stable=$stable" >>"$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.platform }})
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          tags: ghcr.io/labstack/fanout:${{ github.sha }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=fanout-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=fanout-${{ matrix.suffix }}

  docker-manifest:
    runs-on: ubuntu-24.04
    needs: docker
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stitch multi-arch manifests
        env:
          IMAGE: ghcr.io/labstack/fanout
          VERSION: ${{ needs.docker.outputs.version }}
          STABLE: ${{ needs.docker.outputs.stable }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$VERSION" ]]; then
            echo "::error::empty VERSION from docker job"
            exit 1
          fi
          # Strip leading 'v' so the version tag matches the historical scheme.
          tag="${VERSION#v}"
          tag_args=(-t "$IMAGE:$tag")
          # Only move :latest on stable releases — prereleases shouldn't
          # clobber what users pin to.
          if [[ "$STABLE" == "true" ]]; then
            tag_args+=(-t "$IMAGE:latest")
          fi
          docker buildx imagetools create \
            "${tag_args[@]}" \
            "$IMAGE:$SHA-amd64" \
            "$IMAGE:$SHA-arm64"

  # ── Finalise: merge partial dists + publish GH Release ───────────────
  release:
    runs-on: ubuntu-24.04
    needs: [binaries, docker-manifest]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download partial dists
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: false

      - name: Verify all partial dists present
        run: |
          set -euo pipefail
          missing=()
          for d in dist-linux-amd64 dist-linux-arm64 dist-darwin-arm64; do
            if [[ ! -f "dist/$d/artifacts.json" ]]; then
              missing+=("$d")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::missing partial dist(s): ${missing[*]}"
            exit 1
          fi

      - name: goreleaser continue --merge
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: continue --merge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
