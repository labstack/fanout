name: release

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  IMAGE: ghcr.io/labstack/fanout
  DOCKERHUB_IMAGE: docker.io/labstack/fanout

jobs:
  verify:
    name: verify release source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate CalVer tag and lineage
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]{4}\.([1-9]|1[0-2])\.([0-9]|[1-9][0-9]*)$ ]] || {
            echo "release tag must match v{YYYY}.{M}.{N}" >&2
            exit 1
          }
          git fetch origin main --tags
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || {
            echo "release tag is not on main" >&2
            exit 1
          }
          newest="$(git tag --list 'v*.*.*' --sort=-v:refname | head -1)"
          [ "${newest}" = "${GITHUB_REF_NAME}" ] || {
            echo "${GITHUB_REF_NAME} is not the newest release tag (${newest})" >&2
            exit 1
          }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          args: --help
      - run: just ui-deps
      - run: just check
      - run: just test-race

  # DuckDB needs CGO and this repository carries no cross toolchain, so every
  # binary is built on a runner of its own architecture.
  binaries:
    name: binary (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: ubuntu-24.04, goos: linux, goarch: amd64 }
          - { runner: ubuntu-24.04-arm, goos: linux, goarch: arm64 }
          - { runner: macos-15, goos: darwin, goarch: arm64 }
          - { runner: macos-15-intel, goos: darwin, goarch: amd64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p stage
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o stage/fanout ./cmd/fanout
          for doc in LICENSE NOTICE README.md THIRD_PARTY_NOTICES TRADEMARK.md; do
            if [ -f "${doc}" ]; then cp "${doc}" stage/; fi
          done
          tar -czf "fanout_${version}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz" -C stage .
      - name: Smoke test the binary
        run: |
          set -euo pipefail
          got="$(./stage/fanout -version)"
          [ "${got}" = "${GITHUB_REF_NAME}" ] || { echo "version = ${got}, want ${GITHUB_REF_NAME}"; exit 1; }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fanout_${{ matrix.goos }}_${{ matrix.goarch }}
          path: fanout_*.tar.gz
          if-no-files-found: error

  # Each image layer is built natively and the two are joined into one manifest,
  # rather than emulating a CGO build under QEMU.
  image:
    name: image (${{ matrix.platform }})
    needs: verify
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux/amd64, arch: amd64 }
          - { runner: ubuntu-24.04-arm, platform: linux/arm64, arch: arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: VERSION=${{ github.ref_name }}
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Scan the native image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          version: v0.74.0
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: 1
          format: table
      - name: Record the digest
        run: |
          set -euo pipefail
          mkdir -p digests
          echo "${{ steps.build.outputs.digest }}" > "digests/${{ matrix.arch }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          if-no-files-found: error

  manifest:
    name: image manifest
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: digests
          pattern: digest-*
          merge-multiple: true
      - name: Create and push the multi-architecture manifest
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          refs=""
          for arch in amd64 arm64; do
            digest="$(cat "digests/${arch}")"
            [ -n "${digest}" ] || { echo "missing digest for ${arch}"; exit 1; }
            refs="${refs} ${IMAGE}@${digest}"
          done
          for tag in "${version}" latest; do
            # shellcheck disable=SC2086
            docker buildx imagetools create -t "${IMAGE}:${tag}" ${refs}
          done
          docker buildx imagetools inspect "${IMAGE}:${version}"

  anonymous-image:
    name: anonymous GHCR pull
    needs: manifest
    runs-on: ubuntu-24.04
    steps:
      - name: Verify the documented public install path
        run: |
          version="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5; do
            if docker pull "${IMAGE}:${version}"; then
              exit 0
            fi
            echo "anonymous pull attempt ${attempt} failed; retrying" >&2
            sleep 10
          done
          echo "release image is not anonymously pullable" >&2
          exit 1

  dockerhub:
    name: mirror image to Docker Hub
    needs: manifest
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Copy the accepted multi-architecture manifest
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          docker buildx imagetools create \
            --tag "${DOCKERHUB_IMAGE}:${version}" \
            --tag "${DOCKERHUB_IMAGE}:latest" \
            "${IMAGE}:${version}"
          source_digest="$(docker buildx imagetools inspect "${IMAGE}:${version}" --format '{{.Manifest.Digest}}')"
          mirror_digest="$(docker buildx imagetools inspect "${DOCKERHUB_IMAGE}:${version}" --format '{{.Manifest.Digest}}')"
          [ "${mirror_digest}" = "${source_digest}" ] || {
            echo "Docker Hub digest ${mirror_digest} does not match GHCR ${source_digest}" >&2
            exit 1
          }

  anonymous-dockerhub:
    name: anonymous Docker Hub pull
    needs: dockerhub
    runs-on: ubuntu-24.04
    steps:
      - name: Verify the public mirror
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for attempt in 1 2 3 4 5; do
            if docker pull "${DOCKERHUB_IMAGE}:${version}"; then
              exit 0
            fi
            echo "anonymous Docker Hub pull attempt ${attempt} failed; retrying" >&2
            sleep 10
          done
          echo "Docker Hub release image is not anonymously pullable" >&2
          exit 1

  release:
    name: publish release
    needs: [binaries, manifest, anonymous-image, anonymous-dockerhub]
    runs-on: ubuntu-24.04
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: fanout_*
          merge-multiple: true
      - name: Checksum every archive
        run: |
          set -euo pipefail
          cd artifacts
          ls -1 fanout_*.tar.gz
          sha256sum fanout_*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Attest archives and checksum manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag \
            artifacts/fanout_*.tar.gz artifacts/SHA256SUMS

  verify-release:
    name: verify public release
    needs: release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Download and verify every public asset anonymously
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT
          cd "${tmp}"
          base="https://github.com/labstack/fanout/releases/download/${VERSION}"
          curl -fsSLO "${base}/SHA256SUMS"
          for target in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
            curl -fsSLO "${base}/fanout_${VERSION}_${target}.tar.gz"
          done
          sha256sum -c SHA256SUMS
          for archive in fanout_*.tar.gz; do
            listing="${archive}.contents"
            tar -tzf "${archive}" > "${listing}"
            for document in LICENSE NOTICE README.md THIRD_PARTY_NOTICES TRADEMARK.md; do
              grep -Eq "(^|/)${document}$" "${listing}" || {
                echo "${archive} does not contain ${document}" >&2
                exit 1
              }
            done
          done
          mkdir native
          tar -xzf "fanout_${VERSION}_linux_amd64.tar.gz" -C native ./fanout
          [ "$(native/fanout -version)" = "${VERSION}" ]
      - name: Verify the public installer
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT
          curl -fsSL "https://raw.githubusercontent.com/labstack/fanout/${VERSION}/scripts/install.sh" -o "${tmp}/install.sh"
          FANOUT_VERSION="${VERSION}" FANOUT_PREFIX="${tmp}/bin" sh "${tmp}/install.sh"
          [ "$("${tmp}/bin/fanout" -version)" = "${VERSION}" ]
      - name: Verify GitHub build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT
          cd "${tmp}"
          base="https://github.com/labstack/fanout/releases/download/${VERSION}"
          for target in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
            archive="fanout_${VERSION}_${target}.tar.gz"
            curl -fsSLO "${base}/${archive}"
            gh attestation verify "${archive}" --repo labstack/fanout
          done
