name: Release

on:
  push:
    tags:
      - "fanout/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. fanout/v2026.04.1)"
        required: true

concurrency:
  group: release-fanout
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

defaults:
  run:
    shell: bash

env:
  REGISTRY: ghcr.io
  GO_VERSION: "1.26.1"
  BUN_VERSION: "1.3.9"

jobs:
  # ── Native binaries (Linux amd64, Linux arm64, macOS arm64) ──────────
  # Each runner builds for its own native arch via `goreleaser build
  # --single-target`. CGO + DuckDB under QEMU is impractical, so we avoid
  # cross-compilation entirely. The `release` job collects the per-runner
  # archives + checksums and publishes them with `gh release create`.
  binaries:
    strategy:
      # Surface all three platform logs on cross-platform regressions; the
      # release job requires all three artefacts anyway, so we fail-closed
      # either way.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-14
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # goreleaser needs full git history for changelog

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: goreleaser build --single-target
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: build --clean --single-target
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Archive + checksum
        env:
          # `inputs.tag` is set on workflow_dispatch; `github.ref_name` is the
          # tag on push events. On workflow_dispatch alone, `github.ref_name`
          # is a branch, so always prefer the explicit input.
          TAG: ${{ inputs.tag || github.ref_name }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          # Tag is `fanout/vX.Y.Z`; strip the leading `fanout/v` so archive
          # names match the historical `fanout_X.Y.Z_<os>_<arch>.tar.gz` shape.
          version="${TAG#fanout/v}"
          archive="fanout_${version}_${GOOS}_${GOARCH}.tar.gz"
          # goreleaser nests binaries as dist/fanout_<goos>_<goarch>[_v1]/fanout.
          # The trailing `_v1` is GOAMD64 — only appears for amd64 builds.
          mapfile -t bin_dirs < <(find dist -mindepth 1 -maxdepth 1 -type d -name "fanout_${GOOS}_${GOARCH}*")
          if (( ${#bin_dirs[@]} != 1 )); then
            echo "::error::expected exactly one dist/fanout_${GOOS}_${GOARCH}*/ dir, found ${#bin_dirs[@]}: ${bin_dirs[*]:-<none>}"
            ls -la dist/ || true
            exit 1
          fi
          bin_dir="${bin_dirs[0]}"
          if [[ ! -x "$bin_dir/fanout" ]]; then
            echo "::error::$bin_dir/fanout is not executable"
            exit 1
          fi
          mkdir staging
          cp "$bin_dir/fanout" staging/
          cp README.md staging/
          tar -C staging -czf "$archive" .
          # macOS runners ship `shasum` (Perl) but no GNU `sha256sum`; both
          # produce the same `<hash>  <file>` line format, so downstream
          # `cat *.sha256 > SHA256SUMS` doesn't care which one ran.
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: archive-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            fanout_*.tar.gz
            fanout_*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1

  # ── Multi-arch Docker (linux/amd64, linux/arm64) ─────────────────────
  # Each native runner builds + pushes a SHA-suffixed single-arch image;
  # the manifest job stitches them together under the real tags.
  docker:
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    outputs:
      version: ${{ steps.version.outputs.value }}
      stable: ${{ steps.version.outputs.stable }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve and validate version
        id: version
        # Untrusted inputs flow through env vars, never `${{ }}`
        # interpolation, so a malicious workflow_dispatch payload can't be
        # parsed as shell. Pattern lives in a local var because bash =~
        # behaves more predictably than direct expansion.
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          raw="${INPUT_TAG:-$GITHUB_REF_NAME}"
          # Trim whitespace from copy-paste in workflow_dispatch.
          raw="$(printf '%s' "$raw" | tr -d '[:space:]')"
          pattern='^fanout/v[0-9]{4}\.[0-9]{2}\.[0-9]+(-[A-Za-z0-9.]+)?$'
          if [[ ! "$raw" =~ $pattern ]]; then
            echo "::error::tag must match fanout/vYYYY.MM.N (optionally -suffix), got: $raw"
            exit 1
          fi
          version="${raw#fanout/}"
          # Stable = no prerelease suffix (no '-' in the version part).
          if [[ "$version" == *-* ]]; then
            stable=false
          else
            stable=true
          fi
          echo "value=$version" >>"$GITHUB_OUTPUT"
          echo "stable=$stable" >>"$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.platform }})
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          tags: ghcr.io/labstack/fanout:${{ github.sha }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=fanout-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=fanout-${{ matrix.suffix }}

  docker-manifest:
    runs-on: ubuntu-24.04
    needs: docker
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stitch multi-arch manifests
        env:
          IMAGE: ghcr.io/labstack/fanout
          VERSION: ${{ needs.docker.outputs.version }}
          STABLE: ${{ needs.docker.outputs.stable }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -z "$VERSION" ]]; then
            echo "::error::empty VERSION from docker job"
            exit 1
          fi
          # Strip leading 'v' so the version tag matches the historical scheme.
          tag="${VERSION#v}"
          tag_args=(-t "$IMAGE:$tag")
          # Only move :latest on stable releases — prereleases shouldn't
          # clobber what users pin to.
          if [[ "$STABLE" == "true" ]]; then
            tag_args+=(-t "$IMAGE:latest")
          fi
          docker buildx imagetools create \
            "${tag_args[@]}" \
            "$IMAGE:$SHA-amd64" \
            "$IMAGE:$SHA-arm64"

  # ── Finalise: collect per-runner archives + publish GH Release ───────
  release:
    runs-on: ubuntu-24.04
    needs: [binaries, docker-manifest]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download archives
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: archive-*
          merge-multiple: true

      - name: Verify all archives present + assemble checksums
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#fanout/v}"
          missing=()
          for target in linux_amd64 linux_arm64 darwin_arm64; do
            f="fanout_${version}_${target}.tar.gz"
            [[ -f "artifacts/$f" ]] || missing+=("$f")
            [[ -f "artifacts/$f.sha256" ]] || missing+=("$f.sha256")
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::missing artefact(s): ${missing[*]}"
            ls -la artifacts/ || true
            exit 1
          fi
          # Assemble the combined SHA256SUMS from the per-target .sha256 files
          # (each is one `<hash>  <file>` line). Iterating the explicit target
          # list rather than a glob keeps a single missing .sha256 from being
          # silently dropped.
          cd artifacts
          : > SHA256SUMS
          for target in linux_amd64 linux_arm64 darwin_arm64; do
            cat "fanout_${version}_${target}.tar.gz.sha256" >> SHA256SUMS
          done
          rm -f *.tar.gz.sha256

      - name: Generate changelog
        id: changelog
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Find the previous fanout/v* tag for the diff window. If this is
          # the first per-component release, fall back to the prior monolithic
          # `v*` tag (PR #98 introduced the `fanout/` prefix scheme).
          prev=$(git tag --list "fanout/v*" --sort=-v:refname | grep -vFx "$TAG" | head -1 || true)
          if [[ -z "$prev" ]]; then
            prev=$(git tag --list "v*" --sort=-v:refname | head -1 || true)
          fi
          {
            echo "## Changes"
            echo
            if [[ -n "$prev" ]]; then
              git log "$prev..$TAG" \
                --pretty='format:* %s (%h)' \
                --invert-grep \
                --grep='^chore:' --grep='^docs:' --grep='^test:' \
                --grep='^style:' --grep='^ci:' --grep='^Merge pull request'
              echo
            else
              echo "* Initial release."
            fi
          } > CHANGELOG.md
          echo "prev=${prev:-<initial>}" >>"$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#fanout/v}"
          # Treat a `-suffix` version as a prerelease so users pinning to
          # latest don't get pulled in.
          prerelease=()
          if [[ "$version" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          # Split create + upload so retries (workflow_dispatch on an
          # existing partial release) converge instead of erroring with
          # "release already exists". `--clobber` on upload replaces any
          # asset whose name matches.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; updating notes + assets."
            gh release edit "$TAG" \
              --notes-file CHANGELOG.md \
              "${prerelease[@]}"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file CHANGELOG.md \
              "${prerelease[@]}"
          fi
          gh release upload "$TAG" --clobber \
            artifacts/*.tar.gz \
            artifacts/SHA256SUMS
