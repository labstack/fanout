name: Release

on:
  push:
    tags:
      - "fanout/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. fanout/v2026.04.1)"
        required: true

concurrency:
  group: release-fanout
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

defaults:
  run:
    shell: bash

env:
  REGISTRY: ghcr.io

jobs:
  # Validate the tag once and surface version + prerelease flag for the
  # downstream jobs. Untrusted inputs flow through env vars, never `${{ }}`
  # interpolation, so a malicious workflow_dispatch payload can't be parsed
  # as shell.
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.value }}
      version: ${{ steps.tag.outputs.version }}
      stable: ${{ steps.tag.outputs.stable }}
    steps:
      - name: Resolve and validate tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          raw="${INPUT_TAG:-$GITHUB_REF_NAME}"
          raw="$(printf '%s' "$raw" | tr -d '[:space:]')"
          pattern='^fanout/v[0-9]{4}\.[0-9]{2}\.[0-9]+(-[A-Za-z0-9.]+)?$'
          if [[ ! "$raw" =~ $pattern ]]; then
            echo "::error::tag must match fanout/vYYYY.MM.N (optionally -suffix), got: $raw"
            exit 1
          fi
          version="${raw#fanout/v}"
          # Stable = no prerelease suffix (no '-' in the version part).
          if [[ "$version" == *-* ]]; then
            stable=false
          else
            stable=true
          fi
          echo "value=$raw" >>"$GITHUB_OUTPUT"
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "stable=$stable" >>"$GITHUB_OUTPUT"

  # Each native runner builds + pushes a SHA-suffixed single-arch image;
  # the manifest job stitches them under the real tags. CGO + DuckDB make
  # QEMU cross-builds impractical, so we stick to native runners.
  docker:
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (${{ matrix.platform }})
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
          tags: ${{ env.REGISTRY }}/labstack/fanout:${{ github.sha }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=fanout-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=fanout-${{ matrix.suffix }}

  docker-manifest:
    runs-on: ubuntu-24.04
    needs: [prepare, docker]
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stitch multi-arch manifests
        env:
          IMAGE: ${{ env.REGISTRY }}/labstack/fanout
          VERSION: ${{ needs.prepare.outputs.version }}
          STABLE: ${{ needs.prepare.outputs.stable }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag_args=(-t "$IMAGE:$VERSION")
          # Only move :latest on stable releases — prereleases shouldn't
          # clobber what users pin to.
          if [[ "$STABLE" == "true" ]]; then
            tag_args+=(-t "$IMAGE:latest")
          fi
          docker buildx imagetools create \
            "${tag_args[@]}" \
            "$IMAGE:$SHA-amd64" \
            "$IMAGE:$SHA-arm64"

  release:
    runs-on: ubuntu-24.04
    needs: [prepare, docker-manifest]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          fetch-depth: 0  # full history for changelog

      - name: Generate changelog
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          # Find the previous fanout/v* tag for the diff window. If this is
          # the first per-component release, fall back to the prior monolithic
          # `v*` tag (PR #98 introduced the fanout/ prefix scheme).
          prev=$(git tag --list "fanout/v*" --sort=-v:refname | grep -vFx "$TAG" | head -1 || true)
          if [[ -z "$prev" ]]; then
            prev=$(git tag --list "v[0-9]*" --sort=-v:refname | head -1 || true)
          fi
          if [[ -n "$prev" ]]; then
            changes=$(git log "$prev..$TAG" \
              --pretty='format:* %s (%h)' \
              --invert-grep \
              --grep='^chore:' --grep='^docs:' --grep='^test:' \
              --grep='^style:' --grep='^ci:' --grep='^Merge pull request')
          else
            changes='* Initial release.'
          fi
          # If every commit in the window was filtered (e.g., chore/ci-only
          # release), surface a single "no user-facing changes" line rather
          # than publishing an empty Changes section.
          if [[ -z "$changes" ]]; then
            changes='* Maintenance release (no user-facing changes).'
          fi
          {
            echo "## Docker"
            echo
            echo '```bash'
            echo "docker pull ghcr.io/labstack/fanout:${TAG#fanout/v}"
            echo '```'
            echo
            echo "## Changes"
            echo
            printf '%s\n' "$changes"
          } > CHANGELOG.md

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
          STABLE: ${{ needs.prepare.outputs.stable }}
        run: |
          set -euo pipefail
          # Split create + edit so a retry against a partial release converges.
          flags=()
          if [[ "$STABLE" != "true" ]]; then
            flags+=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" \
              --notes-file CHANGELOG.md \
              "${flags[@]}"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes-file CHANGELOG.md \
              "${flags[@]}"
          fi
