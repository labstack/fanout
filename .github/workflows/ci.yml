name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check (fmt + vet + lint + test + build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          cache: false
          cache-dependency-path: go.sum

      - uses: extractions/setup-just@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9
          args: --help

      - name: Install UI deps
        run: |
          cd ui/host && bun install --frozen-lockfile
          cd ../apps && bun install --frozen-lockfile

      - name: Install site deps
        run: cd site && bun install --frozen-lockfile

      - name: Check
        run: just check

      - name: Build site
        run: cd site && bun run build

      - name: Test
        # -gcflags=all=-d=checkptr=0 disables the unsafe-pointer *alignment*
        # check only — the -race data-race detector stays on. duckdb-go's CGO
        # vector readers (v2.10503.x) trip checkptr on linux/amd64 under -race
        # with a "misaligned pointer conversion" fatal; the read is benign at
        # runtime (prod runs without -race and is healthy). Reproduced + verified
        # in a linux/amd64 container.
        run: just test -race -gcflags=all=-d=checkptr=0 -coverprofile=coverage.txt ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage.txt
        continue-on-error: true

  docker:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - name: fanout
            context: .
            image: ghcr.io/labstack/fanout
            platforms: linux/amd64
          - name: site
            context: ./site
            image: ghcr.io/labstack/fanout-site
            platforms: linux/amd64,linux/arm64
    steps:
      - uses: actions/checkout@v7

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - uses: docker/setup-buildx-action@v4

      - uses: docker/setup-qemu-action@v4
        if: matrix.name == 'site'

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platforms }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
