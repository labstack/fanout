name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      go: ${{ steps.filter.outputs.go }}
      client: ${{ steps.filter.outputs.client }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.github/workflows/ci.yml'
              - '.golangci.yml'
            client:
              - 'client/**'
            docker:
              - 'Dockerfile'
              - '.dockerignore'

  server:
    name: Server (fmt + vet + lint + test + build)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.x"
          cache: false
          cache-dependency-path: go.sum

      - uses: extractions/setup-just@v3

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install client deps
        run: cd client && bun install --frozen-lockfile

      - name: Format check
        run: just fmt-check

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9

      - name: Test
        run: just test -race -coverprofile=coverage.txt ./...

      - name: Build
        run: just build

      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage.txt
        continue-on-error: true

  client:
    name: Client (type check + build)
    needs: changes
    if: needs.changes.outputs.client == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install deps
        run: cd client && bun install --frozen-lockfile

      - name: Type check + build
        run: cd client && bun run build

  docker:
    if: |
      always() &&
      !failure() && !cancelled() &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.go == 'true' || needs.changes.outputs.client == 'true' || needs.changes.outputs.docker == 'true')
    needs: [changes, server, client]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/labstack/fanout
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
