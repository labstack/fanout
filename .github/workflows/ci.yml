name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # DuckDB is a CGO dependency.
  CGO_ENABLED: "1"

jobs:
  # Every step below runs a justfile recipe, named after it. Reproduce any
  # failure locally with the command in the step name — nothing about the gate
  # lives only in this file.
  gate:
    name: Gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      # Pinned rather than `latest`: the embedded browser bundles are committed
      # byte-for-byte and `just ui-check` fails if they drift, so a bun upgrade
      # must be a deliberate commit rather than a surprise from a CI run.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      # The documentation site is npm rather than bun: Astro and Starlight are
      # exercised on npm upstream, and the lockfile is what `just site-build`
      # installs from.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: site/package-lock.json

      # `--help` installs the pinned binary without linting; `just check` runs
      # the real thing, so local and CI share one invocation.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.1
          args: --help

      - name: just ui-deps
        run: just ui-deps

      # `just check` ends with site-build, which cannot run without these.
      # Without it the gate fails as exit 127 — `astro: not found` — which reads
      # like a broken runner rather than a missing install.
      - name: just site-deps
        run: just site-deps

      # fmt-check, lint, dependency audit, UI asset freshness, and
      # backend/frontend tests.
      # lefthook runs on push.
      - name: just check
        run: just check

      # Re-runs the suite under the race detector. Kept out of `check` so the
      # local pre-push hook stays fast.
      - name: just test-race
        run: just test-race

  # Build the exact runtime image on pull requests and reject high/critical OS,
  # Go-binary, or embedded-secret findings before merge.
  container-scan:
    name: Container scan
    if: github.event_name == 'pull_request'
    needs: gate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build the runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          load: true
          push: false
          tags: fanout:ci
          build-args: VERSION=sha-${{ github.event.pull_request.head.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the runtime image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: fanout:ci
          version: v0.74.0
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          exit-code: 1
          format: table

  # Publishes the moving main and commit tags. CalVer images are built natively
  # for both architectures by release.yml; pull requests publish nothing.
  image:
    name: Image
    if: github.event_name == 'push'
    needs: gate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/labstack/fanout
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # linux/amd64 only: DuckDB needs CGO and the build stage has no cross
      # toolchain, so another architecture needs a native runner or QEMU rather
      # than an added platform here.
      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
