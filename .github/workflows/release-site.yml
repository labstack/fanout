name: Release · site

on:
  push:
    tags:
      - "site/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. site/v2026.04.1)"
        required: true

concurrency:
  group: release-site
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Resolve tag (strip "site/" prefix)
        id: version
        run: |
          if [[ -n "${{ inputs.tag }}" ]]; then
            raw="${{ inputs.tag }}"
          else
            raw="${GITHUB_REF_NAME}"
          fi
          echo "value=${raw#site/}" >>"$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/labstack/fanout-site
          tags: |
            type=raw,value=${{ steps.version.outputs.value }}
            type=raw,value=${{ steps.version.outputs.value }},enable=${{ !startsWith(steps.version.outputs.value, 'v') }}
            type=match,pattern=v(.*),group=1,value=${{ steps.version.outputs.value }}
            type=raw,value=latest

      - uses: docker/setup-buildx-action@v4
      - uses: docker/setup-qemu-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./site
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=site
          cache-to: type=gha,mode=max,scope=site
