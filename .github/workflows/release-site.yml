name: Release · site

on:
  push:
    tags:
      - "site/v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. site/v2026.04.1)"
        required: true

concurrency:
  group: release-site
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

defaults:
  run:
    shell: bash

env:
  REGISTRY: ghcr.io

jobs:
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Resolve and validate tag
        id: version
        # Untrusted inputs flow through env vars (never `${{ }}` interpolation)
        # so a malicious workflow_dispatch payload can't run as shell.
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          raw="${INPUT_TAG:-$GITHUB_REF_NAME}"
          raw="$(printf '%s' "$raw" | tr -d '[:space:]')"
          pattern='^site/v[0-9]{4}\.[0-9]{2}\.[0-9]+(-[A-Za-z0-9.]+)?$'
          if [[ ! "$raw" =~ $pattern ]]; then
            echo "::error::tag must match site/vYYYY.MM.N (optionally -suffix), got: $raw"
            exit 1
          fi
          version="${raw#site/}"
          if [[ "$version" == *-* ]]; then
            stable=false
          else
            stable=true
          fi
          echo "value=$version" >>"$GITHUB_OUTPUT"
          echo "stable=$stable" >>"$GITHUB_OUTPUT"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/labstack/fanout-site
          # Two tags: the version (e.g. 2026.04.1) and 'latest' on stable only.
          tags: |
            type=match,pattern=v(.*),group=1,value=${{ steps.version.outputs.value }}
            type=raw,value=latest,enable=${{ steps.version.outputs.stable == 'true' }}

      - uses: docker/setup-buildx-action@v4
      - uses: docker/setup-qemu-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./site
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=site
          cache-to: type=gha,mode=max,scope=site
