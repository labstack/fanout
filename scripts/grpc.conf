user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    server {
        listen 4317 ssl http2;

        ssl_certificate /etc/nginx/certs/fanout.run.crt;
        ssl_certificate_key /etc/nginx/certs/fanout.run.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            grpc_pass grpc://fanout:4317;
        }
    }
}
