<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Background -->
  <rect width="48" height="48" rx="12" fill="#0B1220"/>

  <!-- Center origin -->
  <circle cx="24" cy="24" r="4" fill="#F97316"/>

  <!-- Inner ring -->
  <circle cx="24" cy="24" r="10" fill="none" stroke="#F97316" stroke-width="2" opacity="0.5"/>

  <!-- Outer dashed ring -->
  <circle cx="24" cy="24" r="16" fill="none" stroke="#22D3EE" stroke-width="2" opacity="0.35" stroke-dasharray="4 3"/>

  <!-- Orbiting service dots -->
  <circle cx="34" cy="14" r="2.5" fill="#22D3EE"/>
  <circle cx="14" cy="34" r="2.5" fill="#22D3EE"/>
  <circle cx="36" cy="30" r="2.5" fill="#FBBF24"/>
</svg>
