include:
  - path: demo/docker-compose.yaml
    env_file: demo/.env

services:
  caddy:
    # Built locally (see Dockerfile.caddy) because the wildcard cert for
    # *.fanout.run + the apex requires the Cloudflare DNS plugin, which
    # isn't in the stock caddy:alpine image. ACME uses the DNS-01 challenge
    # — works regardless of Cloudflare's proxy state on the records.
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "4317:4317"   # OTLP/gRPC ingest, TLS-terminated by Caddy
    environment:
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-v@labstack.com}
      CF_API_TOKEN: ${CF_API_TOKEN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /data/caddy:/data
      - /data/caddy-config:/config

  fanout-site:
    image: ghcr.io/labstack/fanout-site:${VERSION:-latest}
    container_name: fanout-site
    restart: unless-stopped
    expose:
      - "80"

  # fanout.labstack.com — own production instance. Secrets (JWT/SMTP/AI)
  # live in instance/.env.secrets (gitignored); the deploy host must have
  # this file in place before `docker compose up`.
  fanout:
    image: ghcr.io/labstack/fanout:${FANOUT_VERSION:-latest}
    container_name: fanout
    restart: unless-stopped
    env_file:
      - instance/.env.secrets
    environment:
      DATA_DIR: /var/lib/fanout/data
      HTTP_ADDR: :7520
      OTLP_GRPC_ADDR: :4317
    expose:
      - "7520"
    volumes:
      - /data/fanout:/var/lib/fanout
    healthcheck:
      test: ["CMD", "wget", "-qO/dev/null", "http://localhost:7520/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
