include:
  - path: demo/docker-compose.yaml
    env_file: demo/.env

services:
  traefik:
    # Stock image; lego (with Cloudflare DNS provider) is built in.
    # CF_DNS_API_TOKEN lives in traefik/.env (gitignored).
    image: traefik:v3.7
    container_name: traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "4317:4317"   # OTLP/gRPC ingest, TLS-terminated by Traefik
    env_file:
      - traefik/.env
    volumes:
      - ./traefik/static.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
      - /data/traefik/letsencrypt:/letsencrypt
    healthcheck:
      # `traefik healthcheck` hits the /ping endpoint enabled in static.yml.
      # No `--ping` flag — that's the static-config switch (already set),
      # not a subcommand argument.
      test: ["CMD", "traefik", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Marketing site at fanout.run + www.fanout.run. Image still published as
  # `ghcr.io/labstack/fanout-site` (registry coordinate is permanent); the
  # local service/container is just `site`.
  site:
    image: ghcr.io/labstack/fanout-site:${SITE_VERSION:?SITE_VERSION must be set (use scripts/yeet.sh, which resolves from git tags)}
    container_name: site
    restart: unless-stopped
    expose:
      - "80"

  # fanout.labstack.com (web UI) + ingest.fanout.labstack.com:4317 (OTLP).
  # Our own production instance. Secrets (JWT/SMTP/AI) live in fanout/.env
  # (gitignored); the deploy host must have this file in place before `up`.
  fanout:
    image: ghcr.io/labstack/fanout:${FANOUT_VERSION:?FANOUT_VERSION must be set (use scripts/yeet.sh, which resolves from git tags)}
    container_name: fanout
    restart: unless-stopped
    env_file:
      - fanout/.env
    environment:
      DATA_DIR: /var/lib/fanout/data
      HTTP_ADDR: :7520
      OTLP_GRPC_ADDR: :4317
    expose:
      - "7520"
    volumes:
      - /data/fanout:/var/lib/fanout
    healthcheck:
      test: ["CMD", "wget", "-qO/dev/null", "http://127.0.0.1:7520/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
