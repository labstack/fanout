include:
  - path: demo/docker-compose.yaml
    env_file: demo/.env

services:
  caddy:
    image: caddy:alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-v@labstack.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /data/caddy:/data
      - /data/caddy-config:/config

  fanout-site:
    image: ghcr.io/labstack/fanout-site:${VERSION:-latest}
    container_name: fanout-site
    restart: unless-stopped
    expose:
      - "80"

  # fanout.labstack.com — own production instance. Secrets (JWT/SMTP/AI)
  # live in instance/.env.secrets (gitignored); the deploy host must have
  # this file in place before `docker compose up`.
  fanout-instance:
    image: ghcr.io/labstack/fanout:${FANOUT_VERSION:-latest}
    container_name: fanout-instance
    restart: unless-stopped
    env_file:
      - instance/.env.secrets
    environment:
      DATA_DIR: /var/lib/fanout/data
      HTTP_ADDR: :7520
      OTLP_GRPC_ADDR: :4317
    expose:
      - "7520"
    volumes:
      - /data/fanout-instance:/var/lib/fanout
    healthcheck:
      test: ["CMD", "wget", "-qO/dev/null", "http://localhost:7520/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
