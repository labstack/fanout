<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" style="background: #ffffff;">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L0,8 L8,4 z" fill="#3b82f6"/>
    </marker>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#eff6ff"/>
      <stop offset="100%" style="stop-color:#dbeafe"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0fdf4"/>
      <stop offset="100%" style="stop-color:#dcfce7"/>
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fffbeb"/>
      <stop offset="100%" style="stop-color:#fef3c7"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#faf5ff"/>
      <stop offset="100%" style="stop-color:#f3e8ff"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="500" y="35" text-anchor="middle" style="font-family: system-ui, sans-serif; font-size: 24px; font-weight: 700; fill: #0f172a;">Fanout</text>
  <text x="500" y="55" text-anchor="middle" style="font-family: system-ui, sans-serif; font-size: 12px; fill: #64748b;">Single-binary observability platform</text>

  <!-- ========== SECTION 1: DATA SOURCES ========== -->
  <g transform="translate(40, 90)">
    <!-- Section label -->
    <text x="60" y="0" text-anchor="middle" style="font-family: system-ui; font-size: 10px; fill: #94a3b8; text-transform: uppercase; letter-spacing: 1px;">Sources</text>

    <!-- App boxes -->
    <g transform="translate(0, 15)">
      <rect width="120" height="50" rx="8" fill="url(#grad-blue)" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="60" y="22" text-anchor="middle" style="font-family: system-ui; font-size: 13px; font-weight: 600; fill: #1e40af;">Your Apps</text>
      <text x="60" y="38" text-anchor="middle" style="font-family: system-ui; font-size: 10px; fill: #3b82f6;">OTEL SDK</text>
    </g>

    <g transform="translate(0, 75)">
      <rect width="120" height="50" rx="8" fill="url(#grad-blue)" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="60" y="22" text-anchor="middle" style="font-family: system-ui; font-size: 13px; font-weight: 600; fill: #1e40af;">Collectors</text>
      <text x="60" y="38" text-anchor="middle" style="font-family: system-ui; font-size: 10px; fill: #3b82f6;">OTEL Collector</text>
    </g>

    <g transform="translate(0, 135)">
      <rect width="120" height="50" rx="8" fill="url(#grad-blue)" stroke="#3b82f6" stroke-width="1.5"/>
      <text x="60" y="22" text-anchor="middle" style="font-family: system-ui; font-size: 13px; font-weight: 600; fill: #1e40af;">Libraries</text>
      <text x="60" y="38" text-anchor="middle" style="font-family: system-ui; font-size: 10px; fill: #3b82f6;">Auto-instrumentation</text>
    </g>
  </g>

  <!-- Arrow: Sources -> Ingest -->
  <g>
    <path d="M170,180 L220,180" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="175" y="155" width="40" height="16" rx="3" fill="#f1f5f9"/>
    <text x="195" y="166" text-anchor="middle" style="font-family: monospace; font-size: 9px; fill: #64748b;">gRPC</text>
  </g>

  <!-- ========== SECTION 2: INGEST ========== -->
  <g transform="translate(230, 90)">
    <text x="70" y="0" text-anchor="middle" style="font-family: system-ui; font-size: 10px; fill: #94a3b8; text-transform: uppercase; letter-spacing: 1px;">Ingest</text>

    <rect x="0" y="15" width="140" height="200" rx="10" fill="url(#grad-green)" stroke="#22c55e" stroke-width="2"/>

    <!-- Port badge -->
    <rect x="95" y="8" width="42" height="18" rx="9" fill="#22c55e"/>
    <text x="116" y="20" text-anchor="middle" style="font-family: monospace; font-size: 10px; fill: white;">:4317</text>

    <text x="70" y="45" text-anchor="middle" style="font-family: system-ui; font-size: 14px; font-weight: 600; fill: #166534;">OTLP Server</text>

    <!-- Signal types -->
    <g transform="translate(15, 60)">
      <rect width="110" height="35" rx="6" fill="#bbf7d0" stroke="#22c55e" stroke-width="1"/>
      <text x="55" y="16" text-anchor="middle" style="font-family: system-ui; font-size: 11px; font-weight: 500; fill: #166534;">Traces</text>
      <text x="55" y="28" text-anchor="middle" style="font-family: system-ui; font-size: 9px; fill: #22c55e;">spans, events, links</text>
    </g>

    <g transform="translate(15, 105)">
      <rect width="110" height="35" rx="6" fill="#bbf7d0" stroke="#22c55e" stroke-width="1"/>
      <text x="55" y="16" text-anchor="middle" style="font-family: system-ui; font-size: 11px; font-weight: 500; fill: #166534;">Logs</text>
      <text x="55" y="28" text-anchor="middle" style="font-family: system-ui; font-size: 9px; fill: #22c55e;">severity, body, attrs</text>
    </g>

    <g transform="translate(15, 150)">
      <rect width="110" height="35" rx="6" fill="#bbf7d0" stroke="#22c55e" stroke-width="1"/>
      <text x="55" y="16" text-anchor="middle" style="font-family: system-ui; font-size: 11px; font-weight: 500; fill: #166534;">Metrics</text>
      <text x="55" y="28" text-anchor="middle" style="font-family: system-ui; font-size: 9px; fill: #22c55e;">gauge, counter, hist</text>
    </g>
  </g>

  <!-- Arrow: Ingest -> Storage -->
  <g>
    <path d="M380,180 L430,180" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="382" y="155" width="45" height="16" rx="3" fill="#f1f5f9"/>
    <text x="405" y="166" text-anchor="middle" style="font-family: system-ui; font-size: 9px; fill: #64748b;">15s batch</text>
  </g>

  <!-- ========== SECTION 3: STORAGE ========== -->
  <g transform="translate(440, 90)">
    <text x="70" y="0" text-anchor="middle" style="font-family: system-ui; font-size: 10px; fill: #94a3b8; text-transform: uppercase; letter-spacing: 1px;">Storage</text>

    <rect x="0" y="15" width="140" height="200" rx="10" fill="url(#grad-amber)" stroke="#f59e0b" stroke-width="2"/>

    <text x="70" y="45" text-anchor="middle" style="font-family: system-ui; font-size: 14px; font-weight: 600; fill: #b45309;">Data Lake</text>
    <text x="70" y="60" text-anchor="middle" style="font-family: system-ui; font-size: 10px; fill: #d97706;">Parquet files</text>

    <!-- Partition structure -->
    <g transform="translate(15, 75)">
      <rect width="110" height="55" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
      <text x="10" y="15" style="font-family: monospace; font-size: 9px; fill: #92400e;">lake/</text>
      <text x="20" y="27" style="font-family: monospace; font-size: 9px; fill: #b45309;">spans/year/month/day/</text>
      <text x="20" y="39" style="font-family: monospace; font-size: 9px; fill: #b45309;">logs/year/month/day/</text>
      <text x="20" y="51" style="font-family: monospace; font-size: 9px; fill: #b45309;">metrics/year/month/</text>
    </g>

    <!-- Features -->
    <g transform="translate(15, 140)">
      <rect width="110" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
      <text x="55" y="15" text-anchor="middle" style="font-family: system-ui; font-size: 10px; fill: #92400e;">Columnar compression</text>
      <text x="55" y="30" text-anchor="middle" style="font-family: system-ui; font-size: 10px; fill: #92400e;">Time partitioned</text>
      <text x="55" y="45" text-anchor="middle" style="font-family: system-ui; font-size: 10px; fill: #92400e;">Auto retention</text>
    </g>
  </g>

  <!-- Arrow: Storage -> Query -->
  <g>
    <path d="M590,180 L640,180" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="595" y="155" width="40" height="16" rx="3" fill="#f1f5f9"/>
    <text x="615" y="166" text-anchor="middle" style="font-family: system-ui; font-size: 9px; fill: #64748b;">scan</text>
  </g>

  <!-- ========== SECTION 4: QUERY ========== -->
  <g transform="translate(650, 90)">
    <text x="70" y="0" text-anchor="middle" style="font-family: system-ui; font-size: 10px; fill: #94a3b8; text-transform: uppercase; letter-spacing: 1px;">Query</text>

    <rect x="0" y="15" width="140" height="200" rx="10" fill="url(#grad-purple)" stroke="#a855f7" stroke-width="2"/>

    <text x="70" y="45" text-anchor="middle" style="font-family: system-ui; font-size: 14px; font-weight: 600; fill: #7c3aed;">DuckDB</text>
    <text x="70" y="60" text-anchor="middle" style="font-family: system-ui; font-size: 10px; fill: #a855f7;">Embedded engine</text>

    <!-- Query features -->
    <g transform="translate(15, 75)">
      <rect width="110" height="35" rx="6" fill="#f3e8ff" stroke="#a855f7" stroke-width="1"/>
      <text x="55" y="16" text-anchor="middle" style="font-family: system-ui; font-size: 11px; font-weight: 500; fill: #7c3aed;">SQL Analytics</text>
      <text x="55" y="28" text-anchor="middle" style="font-family: system-ui; font-size: 9px; fill: #a855f7;">aggregations, joins</text>
    </g>

    <g transform="translate(15, 120)">
      <rect width="110" height="35" rx="6" fill="#f3e8ff" stroke="#a855f7" stroke-width="1"/>
      <text x="55" y="16" text-anchor="middle" style="font-family: system-ui; font-size: 11px; font-weight: 500; fill: #7c3aed;">Rollups</text>
      <text x="55" y="28" text-anchor="middle" style="font-family: system-ui; font-size: 9px; fill: #a855f7;">1-min service stats</text>
    </g>

    <g transform="translate(15, 165)">
      <rect width="110" height="35" rx="6" fill="#f3e8ff" stroke="#a855f7" stroke-width="1"/>
      <text x="55" y="16" text-anchor="middle" style="font-family: system-ui; font-size: 11px; font-weight: 500; fill: #7c3aed;">Intelligence</text>
      <text x="55" y="28" text-anchor="middle" style="font-family: system-ui; font-size: 9px; fill: #a855f7;">anomaly detection</text>
    </g>
  </g>

  <!-- Arrow: Query -> API -->
  <g>
    <path d="M800,180 L850,180" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  </g>

  <!-- ========== SECTION 5: API ========== -->
  <g transform="translate(860, 90)">
    <text x="60" y="0" text-anchor="middle" style="font-family: system-ui; font-size: 10px; fill: #94a3b8; text-transform: uppercase; letter-spacing: 1px;">Serve</text>

    <rect x="0" y="15" width="120" height="200" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>

    <!-- Port badge -->
    <rect x="75" y="8" width="42" height="18" rx="9" fill="#3b82f6"/>
    <text x="96" y="20" text-anchor="middle" style="font-family: monospace; font-size: 10px; fill: white;">:7520</text>

    <text x="60" y="45" text-anchor="middle" style="font-family: system-ui; font-size: 14px; font-weight: 600; fill: #1e293b;">HTTP</text>

    <!-- Endpoints -->
    <g transform="translate(10, 60)">
      <rect width="100" height="40" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1"/>
      <text x="50" y="17" text-anchor="middle" style="font-family: system-ui; font-size: 11px; font-weight: 500; fill: #1e40af;">Web UI</text>
      <text x="50" y="32" text-anchor="middle" style="font-family: system-ui; font-size: 9px; fill: #3b82f6;">HTMX + Vega charts</text>
    </g>

    <g transform="translate(10, 110)">
      <rect width="100" height="40" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
      <text x="50" y="17" text-anchor="middle" style="font-family: system-ui; font-size: 11px; font-weight: 500; fill: #166534;">MCP</text>
      <text x="50" y="32" text-anchor="middle" style="font-family: system-ui; font-size: 9px; fill: #22c55e;">10 AI tools</text>
    </g>

    <g transform="translate(10, 160)">
      <rect width="100" height="40" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
      <text x="50" y="17" text-anchor="middle" style="font-family: system-ui; font-size: 11px; font-weight: 500; fill: #b45309;">REST API</text>
      <text x="50" y="32" text-anchor="middle" style="font-family: system-ui; font-size: 9px; fill: #d97706;">JSON endpoints</text>
    </g>
  </g>

  <!-- ========== BOTTOM: Key features ========== -->
  <g transform="translate(0, 340)">
    <line x1="40" y1="0" x2="960" y2="0" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Feature pills -->
    <g transform="translate(100, 20)">
      <rect width="140" height="28" rx="14" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
      <text x="70" y="18" text-anchor="middle" style="font-family: system-ui; font-size: 11px; fill: #475569;">Single binary</text>
    </g>

    <g transform="translate(260, 20)">
      <rect width="140" height="28" rx="14" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
      <text x="70" y="18" text-anchor="middle" style="font-family: system-ui; font-size: 11px; fill: #475569;">No dependencies</text>
    </g>

    <g transform="translate(420, 20)">
      <rect width="140" height="28" rx="14" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
      <text x="70" y="18" text-anchor="middle" style="font-family: system-ui; font-size: 11px; fill: #475569;">Sub-second queries</text>
    </g>

    <g transform="translate(580, 20)">
      <rect width="140" height="28" rx="14" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
      <text x="70" y="18" text-anchor="middle" style="font-family: system-ui; font-size: 11px; fill: #475569;">AI-native (MCP)</text>
    </g>

    <g transform="translate(740, 20)">
      <rect width="140" height="28" rx="14" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1"/>
      <text x="70" y="18" text-anchor="middle" style="font-family: system-ui; font-size: 11px; fill: #475569;">30-day retention</text>
    </g>
  </g>

  <!-- Data flow annotation -->
  <g transform="translate(40, 420)">
    <text x="0" y="0" style="font-family: system-ui; font-size: 11px; fill: #94a3b8;">
      <tspan font-weight="500" fill="#64748b">Data flow:</tspan>
      <tspan> Apps send telemetry via OTLP gRPC → Batched every 15s to Parquet → Queried with DuckDB → Served via HTTP</tspan>
    </text>
  </g>
</svg>