schema: spec-driven

context: |
  Fanout is a self-hosted, single-binary OpenTelemetry investigation system.
  The Go process owns OTLP/gRPC ingest, DuckLake/Parquet storage, DuckDB
  queries and rollups, SQLite control state, alerts, authentication, an AG-UI
  agent, a Streamable HTTP MCP server, and embedded React assets. The React
  host lives in ui/host, portable MCP Apps live in ui/apps, and the public
  Astro site lives in site.

  Canonical specs describe observable, shipped behavior. The implementation,
  tests, migrations, and runtime configuration are authoritative when adopting
  or correcting the baseline. Proposed behavior belongs in an OpenSpec change,
  not in a canonical spec or runbook. Operational procedures may remain under
  docs/ or site/, but they link to specs and do not redefine product behavior.

  Go code is gofmt-clean and tested beside the implementation. TypeScript uses
  two-space indentation and must type-check. DuckDB requires CGO_ENABLED=1.
  Use just for build, test, lint, docs validation, and release workflows.

rules:
  proposal:
    - State whether the change affects runtime behavior, public contracts, data, security, or only documentation/tooling.
    - Name every affected canonical capability and keep non-goals explicit.
  specs:
    - Describe shipped behavior as normative requirements with observable WHEN/THEN scenarios.
    - Keep implementation detail out unless it is a compatibility, security, persistence, or operational contract.
    - Separate browser sessions, MCP OAuth credentials, ingest credentials, and public demo modes; never imply they are interchangeable.
    - Do not present exploratory UI visions, benchmark snapshots, or future capabilities as shipped behavior.
  design:
    - Identify the code, tests, configuration, and data contracts that establish the current baseline.
    - Record conflicts with existing documents and how they are resolved.
    - Include security, migration, deployment, and backward-compatibility implications where applicable.
  tasks:
    - Include implementation or documentation work, tests, synchronization, and verification evidence.
    - Do not mark work complete without a code, test, or operational evidence reference.

operations:
  apply:
    guidance:
      - Re-read affected canonical specs before editing code.
      - Keep implementation, tests, public docs, and spec deltas aligned.
      - Preserve unrelated local worktree changes.
  archive:
    guidance:
      - Validate all specs and changes strictly before archiving.
      - Confirm completed tasks have evidence and no unresolved requirement conflicts.
      - Treat merged canonical specs as the only current product truth.
