# Default secret rules, plus links and paths this public repository must never
# publish, and known non-secrets: a fixed test-only auth code secret, a
# redaction fixture, a cache key name, and content hashes in fixtures.
# Lefthook and the Leaks workflow read this file; add a rule here to extend both.
[extend]
useDefault = true

[[allowlists]]
description = "test-only fake secrets and cache key names"
regexes = [
  '''^0123456789abcdef0123456789abcdef$''',
  '''^sk-live-abc123$''',
  '''^edge_rollup_v2_rawmax$''',
]

[[allowlists]]
description = "content hashes in fixtures"
paths = [
  '''^ui/host/e2e/data/mcp\.json$''',
  '''^ui/host/tests/go-fragments/[^/]+\.json$''',
]

[[rules]]
id = "private-ai-session-link"
description = "Private AI session link or session trailer"
regex = '''(?i)(claude\.ai/(code|chat|share|project)/|Claude-Session:|chatgpt\.com/(c|share|codex)/)'''
keywords = ["claude", "chatgpt"]

[[rules]]
id = "local-workstation-path"
description = "Local workstation home directory path"
regex = '''(/Users|/home)/[A-Za-z0-9_.-]+/'''
keywords = ["/users/", "/home/"]

[[rules]]
id = "fanout-bearer-secret"
description = "Fanout opaque bearer secret"
regex = '''fo[iacr]_[A-Za-z0-9_-]{43}\b'''
keywords = ["foi_", "foa_", "for_", "foc_"]
