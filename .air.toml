root = "."
tmp_dir = "tmp"

[build]
  entrypoint = "./tmp/fanout"
  cmd = "CGO_ENABLED=1 go build -o ./tmp/fanout ./cmd/fanout"
  delay = 500
  exclude_dir = ["lake", "tmp", "vendor", ".git", "node_modules", "web", "site"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  include_dir = ["cmd", "internal"]
  # The browser bundle is embedded by internal/ui/ui.go, so rebuild the Go
  # binary whenever Vite updates an emitted asset.
  include_ext = ["go", "html", "js", "css", "svg"]
  kill_delay = "35s"
  log = "build-errors.log"
  send_interrupt = true
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
