# Traefik startup config. Routers/services live in dynamic.yml.

entryPoints:
  web:
    address: :80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: :443

providers:
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

certificatesResolvers:
  le:
    acme:
      email: v@labstack.com
      storage: /letsencrypt/acme.json
      dnsChallenge:
        provider: cloudflare
        # lego reads CF_DNS_API_TOKEN from the env (set via env_file in compose)

log:
  level: INFO

# /ping endpoint on the internal :8080 — used by `traefik healthcheck`
# inside the container. Not exposed externally.
ping: {}
