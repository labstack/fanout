version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - unused
  exclusions:
    generated: lax
    presets:
      - comments
      - std-error-handling
    rules:
      - linters: [errcheck]
        path: _test\.go
      - linters: [errcheck]
        text: "Close|Remove|Sscanf|Walk|Scan|Read|Export"
      - linters: [staticcheck]
        text: "QF"
